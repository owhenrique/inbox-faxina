[project]
name = "email-cleanup"
version = "0.1.0"
description = "CLI to catalog and clean up an old Gmail inbox via IMAP"
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
email-cleanup = "email_cleanup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_cleanup"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
